spring:
  application:
    name: ttl-advisor
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ttl_advisor}?serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USERNAME:ttl}
    password: ${DB_PASSWORD:ttl}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50
